<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SECRET INDEX</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      padding:32px 18px 60px;
      color:#dce1e4;
      background:#071016;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    }
    main{width:min(760px,100%);margin:auto}
    .eyebrow{
      color:#71808b;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.18em
    }
    h1{font-size:26px;font-weight:650;margin:8px 0}
    .lead{margin:0 0 28px;color:#89949c;font-size:13px;line-height:1.8}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .item{
      padding:13px 14px;
      border:1px solid #1e2c35;
      background:#0a151c;
      display:flex;
      justify-content:space-between;
      gap:10px;
      font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
    }
    .item span:last-child{color:#687883}
    .debug{
      margin-top:24px;
      color:#58656e;
      font-size:11px;
      line-height:1.8
    }
    @media(max-width:540px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">怪盗関連事件特別捜査本部 / RESTRICTED</div>
    <h1>SECRET INDEX</h1>
    <p class="lead">通常の閲覧経路からは確認できない記録の索引。</p>
    <div class="grid" id="grid"></div>
    <p class="debug">※デバッグ版：30件のSECRET本体・FOUND連動は、既存の警察DB全体と統合する際に接続します。</p>
  </main>
  <script>
    const grid=document.getElementById('grid');
    for(let i=1;i<=30;i++){
      const item=document.createElement('div');
      item.className='item';
      item.innerHTML='<span>SECRET '+String(i).padStart(2,'0')+'</span><span>LOCKED</span>';
      grid.appendChild(item);
    }
  </script>
</body>
</html>
