<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1e33">
  <title>SECURE CHAT | 怪盗関連事件特別捜査本部</title>
  <link rel="stylesheet" href="../assets/css/chat.css">
</head>
<body>
  <!-- 初回のみ表示 -->
  <div id="secure-intro" class="secure-intro">
    <div class="secure-intro__noise"></div>
    <div class="secure-intro__panel">
      <div class="secure-mark" aria-hidden="true">
        <span>特</span>
      </div>
      <p class="secure-intro__eyebrow">PHANTOM CRIME SPECIAL INVESTIGATION HQ</p>
      <h1>SECURE CHAT</h1>
      <p class="secure-intro__lead">捜査協力者用の暗号化通信に接続します。</p>

      <div id="connect-status" class="connect-status">
        <div class="connect-status__row">
          <span class="status-light"></span>
          <span id="connect-status-text">接続待機中</span>
        </div>
        <div class="connect-progress"><span id="connect-progress-bar"></span></div>
      </div>

      <button id="connect-button" class="connect-button" type="button">
        セキュアチャット 接続開始
      </button>

      <p class="secure-intro__foot">
        この通信は怪盗関連事件特別捜査本部の捜査協力者専用回線です。
      </p>
    </div>
  </div>

  <main id="chat-app" class="chat-app" hidden>
    <header class="chat-header">
      <div class="chat-header__top">
        <div class="chat-header__identity">
          <div class="chat-avatar chat-avatar--header">相</div>
          <div>
            <div class="chat-header__name">相沢 直人</div>
            <div class="chat-header__dept">怪盗関連事件特別捜査本部</div>
          </div>
        </div>
        <div class="chat-header__secure">
          <span class="secure-dot"></span>
          暗号化接続
        </div>
      </div>
      <div class="chat-header__sub">
        <span>捜査協力者専用チャット</span>
        <span class="online"><i></i>接続中</span>
      </div>
    </header>

    <div class="ai-info">
      <div class="ai-info__icon">AI</div>
      <p>
        本システムには警察本部の会話支援AIが搭載されています。
        会話内容や利用者の反応から感情・状況を推定し、
        必要に応じて返信・行動候補をレコメンドする場合があります。
      </p>
    </div>

    <section id="messages" class="messages" aria-live="polite" aria-label="チャット履歴"></section>

    <div id="typing-area" class="typing-area" aria-live="polite"></div>

    <div id="chat-actions" class="chat-actions"></div>

    <form id="chat-form" class="composer" autocomplete="off">
      <input id="chat-input" type="text" placeholder="メッセージを入力" aria-label="メッセージを入力">
      <button type="submit" aria-label="送信">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.4 20.1 21 12 3.4 3.9 3 10.2l12 1.8-12 1.8.4 6.3Z"/>
        </svg>
      </button>
    </form>
  </main>

  <script>
(function(){
  const M=document.getElementById('messages');
  const T=document.getElementById('typing-area');
  const A=document.getElementById('chat-actions');
  const F=document.getElementById('chat-form');
  const I=document.getElementById('chat-input');
  const APP=document.getElementById('chat-app');
  const INTRO=document.getElementById('secure-intro');
  const CONNECT=document.getElementById('connect-button');
  const STATUS=document.getElementById('connect-status');
  const STATUS_TEXT=document.getElementById('connect-status-text');
  const PROGRESS=document.getElementById('connect-progress-bar');

  const STATE_KEY='phantomPoliceMainChatV5State';
  const DECLINE_KEY='phantomPoliceMainChatV5Declines';
  const LOG_KEY='phantomPoliceMainChatV5Log';
  const INTRO_KEY='phantomSecureChatIntroSeenV1';

  let state=localStorage.getItem(STATE_KEY)||'start';
  let declineCount=parseInt(localStorage.getItem(DECLINE_KEY)||'0',10)||0;
  let log=[];
  let busy=false;
  const qs=new URLSearchParams(location.search);

  try{log=JSON.parse(localStorage.getItem(LOG_KEY)||'[]')}catch(e){log=[]}

  function saveState(s){
    state=s;
    localStorage.setItem(STATE_KEY,s);
  }
  function saveLog(){
    localStorage.setItem(LOG_KEY,JSON.stringify(log));
  }
  function now(){
    return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function scrollBottom(){
    requestAnimationFrame(()=>{M.scrollTop=M.scrollHeight;});
  }

  function renderItem(item,save=false){
    if(item.role==='system'){
      const row=document.createElement('div');
      row.className='message-row system';
      row.innerHTML='<div class="system-pill">'+item.html+'</div>';
      M.appendChild(row);
    }else{
      const row=document.createElement('div');
      row.className='message-row '+(
        item.role==='user'?'mine':
        item.role==='ojisan'?'ojisan':'aizawa'
      );

      if(item.role!=='user'){
        const avatar=document.createElement('div');
        avatar.className='chat-avatar';
        avatar.textContent=item.role==='ojisan'?'？':'相';
        row.appendChild(avatar);
      }

      const stack=document.createElement('div');
      stack.className='message-stack';

      if(item.role!=='user'){
        const name=document.createElement('div');
        name.className='sender-name';
        name.textContent=item.role==='ojisan'?'未登録ユーザー':'相沢 直人';
        stack.appendChild(name);
      }

      const bubble=document.createElement('div');
      bubble.className='bubble';
      bubble.innerHTML=item.html;
      stack.appendChild(bubble);

      const meta=document.createElement('div');
      meta.className='message-meta';
      meta.textContent=item.time||'';
      stack.appendChild(meta);

      row.appendChild(stack);
      M.appendChild(row);
    }

    if(save){
      log.push(item);
      saveLog();
    }
    scrollBottom();
  }

  function addMessage(html,role='aizawa'){
    renderItem({role,html,time:now()},true);
  }
  function addUser(text){
    addMessage(escapeHTML(text),'user');
  }
  function addSystem(text){
    addMessage(escapeHTML(text),'system');
  }

  function clearTyping(){
    T.innerHTML='';
  }
  function showTyping(role='aizawa'){
    const name=role==='ojisan'?'未登録ユーザー':'相沢 直人';
    const av=role==='ojisan'?'？':'相';
    T.innerHTML=
      '<div class="typing-row">'+
        '<div class="chat-avatar">'+av+'</div>'+
        '<div class="typing-stack">'+
          '<div class="typing-name">'+name+'</div>'+
          '<div class="typing-bubble"><i></i><i></i><i></i></div>'+
        '</div>'+
      '</div>';
    scrollBottom();
  }
  function wait(ms){return new Promise(r=>setTimeout(r,ms))}
  function typingTime(html,min=780,max=2200){
    const plain=html.replace(/<[^>]+>/g,'');
    return Math.max(min,Math.min(max,520+plain.length*24));
  }
  async function later(html,delay=null,role='aizawa'){
    showTyping(role);
    await wait(delay===null?typingTime(html):delay);
    clearTyping();
    addMessage(html,role);
  }

  function clearActions(){A.innerHTML=''}
  function recommendations(items){
    A.innerHTML='<div class="ai-recommend-label">会話支援AIの返信候補</div>';
    items.forEach(([label,fn,primary])=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='recommend-chip'+(primary?' primary':'');
      b.textContent=label;
      b.onclick=()=>{
        if(busy)return;
        addUser(label);
        clearActions();
        fn();
      };
      A.appendChild(b);
    });
    scrollBottom();
  }

  function repoRoot(){
    const marker='/police/';
    const i=location.pathname.indexOf(marker);
    if(i>=0)return location.origin+location.pathname.slice(0,i+1);
    return new URL('../../',location.href).href;
  }
  function policeRoot(){
    return repoRoot()+'police/';
  }
  function investigationURL(){
    return repoRoot()+'investigation/';
  }
  function plainURL(url){
    const safe=escapeHTML(url);
    return '<a href="'+safe+'">'+safe+'</a>';
  }

  function normalize(v){
    return String(v)
      .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
      .replace(/[／]/g,'/')
      .replace(/[－―ー]/g,'-')
      .replace(/\s|　/g,'');
  }
  function isCorrectDate(v){
    const n=normalize(v);
    return (
      /2022(?:年|[\/.\-])?10(?:月|[\/.\-])?0?2(?:日)?/.test(n) ||
      /^10(?:月|[\/.\-])0?2(?:日)?$/.test(n)
    );
  }
  function isBirthday(v){
    const n=normalize(v);
    return (
      /2022(?:年|[\/.\-])?10(?:月|[\/.\-])?0?3(?:日)?/.test(n) ||
      /^10(?:月|[\/.\-])0?3(?:日)?$/.test(n)
    );
  }
  function isCorrectPlace(v){
    const n=String(v).replace(/\s|　/g,'');
    return /愛媛|松山|道後/.test(n);
  }

  async function introConversation(){
    if(state!=='start'||busy)return;
    busy=true;

    await later('こんにちは。<br>怪盗関連事件特別捜査本部の相沢です。',650);
    await later('こちらから突然ご連絡する形になってしまい、すみません。急に手紙が届いて驚きましたよね。');
    await later('現在、過去に怪盗による被害に遭われた方へ、順次ご連絡しています。');
    await later('今回、ある事件について捜査へのご協力をお願いしたく、ご連絡しました。');
    await later('ただ、その前に。<br>念のため、簡単な本人確認をさせてください。');
    await later('以前、怪盗による被害に遭われた日付を覚えていますか？<br><br>本人確認のため、教えていただけますか？');

    saveState('verifyDate');
    busy=false;
    I.focus();
  }

  async function dateVerified(){
    saveState('verifyPlace');
    busy=true;
    await later('はい、確認できました。',800);
    await later('もう一点だけお願いします。');
    await later('その事件があった場所は、どちらでしたか？');
    busy=false;
    I.focus();
  }

  async function verified(){
    saveState('offerPending');
    busy=true;

    await later('ありがとうございます。',700);
    await later('本人確認が取れました。');
    await later('2022年10月2日、愛媛県松山市の道後温泉で発生した事件ですね。');

    await later('少し長くなってしまうんですが、今回ご連絡した理由を説明します。');
    await later('実はつい最近、怪盗関連事件特別捜査本部宛てに、送信元の分からないURLが届きました。');
    await later('こちらでも内容の確認と解析を進めています。');
    await later('技術的に危険なページではないことは確認できているんですが……');
    await later('ページの中に、過去の怪盗事件を思わせる内容や、こちらでも意図を判断できていない情報がいくつか含まれています。');
    await later('そこで現在、過去に怪盗による被害に遭われた方の中から、何名かに情報提供と捜査協力をお願いしています。');
    await later('実際に怪盗と関わった方だからこそ、こちらでは気づけていないことに気づく可能性があるんじゃないかと考えています。');
    await later('もちろん、危険なことをお願いするつもりはありません。');
    await later('こちらからお渡しする資料を確認して、何か気づいたことがあれば教えていただきたい、というお願いです。');
    await later('突然こんなお願いをしてしまってすみません。');
    await later('もしよければ、今回の捜査に協力していただけませんか？');

    saveState('offer');
    recommendations([
      ['捜査に協力する',cooperate,true],
      ['捜査に協力しない',decline,false]
    ]);
    busy=false;
  }

  async function decline(){
    busy=true;
    declineCount++;
    localStorage.setItem(DECLINE_KEY,String(declineCount));

    if(declineCount===1){
      await later('え、協力しない……？',650);
      await later('冗談……ですよね？',900);
      await later('あ、もしかしてAIのレコメンド機能で、間違えて押しちゃいました？（笑）');
      await later('僕もたまにやっちゃうんですよ（笑）');
      await later('じゃあ、改めて聞きますね。');
    }else if(declineCount===2){
      await later('……またですか？（笑）',650);
      await later('AI、今日はずいぶん調子が悪いみたいですね。');
      await later('では、改めてもう一度。');
    }else{
      await later('……なるほど（笑）',650);
      await later('たぶん、また押し間違いですよね。');
      await later('それでは改めて。');
    }

    await later('今回の捜査に協力していただけますか？');

    recommendations([
      ['捜査に協力する',cooperate,true],
      ['捜査に協力しない',decline,false]
    ]);
    busy=false;
  }

  async function cooperate(){
    busy=true;
    saveState('mission');

    await later('はい、ありがとうございます。',700);
    await later('助かります。');

    await later('それでは、今回発見された不審なURLを共有させていただきます。');
    addMessage(plainURL(investigationURL()));

    await later('現時点では、危険なプログラムなどは確認されていませんので、そのまま開いていただいて大丈夫です。');

    await later('あと、何かの手がかりになるかもしれないので、怪盗に関する情報のデータベースもお渡ししておきます。');
    addMessage(plainURL(policeRoot()+'db/'));

    await later('過去の事件や怪盗に関する情報が入っています。気になる言葉や番号があれば、こちらも確認してみてください。');

    await later('それと、捜査協力をお願いする方には、本部の概要や公開可能な資料をご確認いただけるよう、準備公開版のホームページもあわせてご案内する運用になっています。');
    await later('今回お送りしたデータベースも、このサイトの一部です。');
    addMessage(plainURL(policeRoot()));

    await later('何か分からない点や、気になることがあれば、このチャットでお気軽に聞いてください！');

    busy=false;
  }

  async function report(){
    if(state==='reported'||state==='squirrelReported')return;
    busy=true;
    clearActions();
    saveState('reported');

    addUser('調査結果を相沢さんに報告する');
    await later('お疲れさまでした。少々お待ちください、照合結果を確認します。',1000);
    await later('……確認できました。5件とも一致しています。');
    await later('本部内部の記録に関する内容も含まれていますので、私の方で判断せず、担当部署へそのまま共有します。');
    await later('ご協力ありがとうございました。今回お願いしていた調査は、これで——');

    await wait(900);
    addSystem('通信経路に未登録の接続を検知しました');
    await later('……すみません。今、こちらの画面に見慣れない接続表示が出ています。',1000);

    await later('やっほ〜😏　警察さんのお手伝い、おつかれサマ〜♪',1100,'ojisan');
    await later('相変わらずマジメだネ〜。でも、まだ終わりじゃないヨ。',1500,'ojisan');
    await later('次はパソコンばっかり見てないで、お家の中を使って遊ぼっか🏠✨',1700,'ojisan');

    addMessage('<a href="../mission/house/">../police/mission/house/</a>','ojisan');
    busy=false;
  }

  async function squirrel(){
    busy=true;
    clearActions();
    saveState('squirrelReported');

    addUser('家の中で見つけたものを相沢さんに報告する');
    await later('お戻りですね。何か見つかったんですか？',850);
    await later('……「リス」ですか？');
    await later('少々待ってください。先ほど表示された追加指示は、こちらから送信したものではありません。');
    await later('もし、その指示をたどって実際にご自宅の中で何かを見つけたのであれば……');
    await later('誰かが、あなたの家の中に入った可能性があります。',1800);

    await wait(800);
    addSystem('通信経路に未登録の接続を検知しました');
    await later('あ、バレちゃった！？😳',850,'ojisan');
    await later('そんな怖い顔しないでヨ〜。何にも盗んでないってば‼️',1350,'ojisan');
    await later('せっかくだから、もう少しだけ遊ぼっか♪',1350,'ojisan');
    addMessage('<a href="../mission/trace/">../police/mission/trace/</a>','ojisan');

    busy=false;
  }

  async function generic(){
    if(state==='mission'){
      return later('ありがとうございます。まずは先ほどお送りしたURLを確認してみてください。何か気になることがあれば教えてください。',760);
    }
    if(state==='reported'){
      return later('先ほどの未登録接続について確認しています。表示された指示には十分注意してください。',760);
    }
    if(state==='squirrelReported'){
      return later('安全のため、周囲を確認しながら進めてください。',760);
    }
    return later('ありがとうございます。確認します。',700);
  }

  F.addEventListener('submit',async e=>{
    e.preventDefault();
    if(busy)return;

    const v=I.value.trim();
    if(!v)return;

    addUser(v);
    I.value='';
    clearActions();

    if(state==='verifyDate'){
      busy=true;
      if(isCorrectDate(v)){
        busy=false;
        return dateVerified();
      }
      if(isBirthday(v)){
        await later('惜しいです。10月3日ではなく、その前日に起きた事件です。怪盗による被害が確認された日を思い出してみてください。',820);
        busy=false;
        return;
      }
      await later('すみません。こちらの記録とは一致しないようです。もう一度思い出してみてもらえますか？',820);
      busy=false;
      return;
    }

    if(state==='verifyPlace'){
      busy=true;
      if(isCorrectPlace(v)){
        busy=false;
        return verified();
      }
      await later('すみません。こちらの記録とは一致しないようです。当時の旅行先を思い出してみてもらえますか？',820);
      busy=false;
      return;
    }

    if(state==='offer'){
      if(/協力|やる|はい|いいよ|お願い/.test(v))return cooperate();
      if(/しない|無理|いや|嫌|断/.test(v))return decline();

      await later('ありがとうございます。今回の捜査に協力していただけますか？',700);
      recommendations([
        ['捜査に協力する',cooperate,true],
        ['捜査に協力しない',decline,false]
      ]);
      return;
    }

    return generic();
  });

  function restoreLog(){
    M.innerHTML='';
    for(const item of log)renderItem(item,false);
    scrollBottom();
  }

  function restoreActions(){
    if(state==='offer'){
      recommendations([
        ['捜査に協力する',cooperate,true],
        ['捜査に協力しない',decline,false]
      ]);
      return;
    }

    if(state==='mission' && localStorage.getItem('phantomPolicePuzzleComplete')==='1'){
      recommendations([
        ['照合結果を相沢さんに報告する',()=>location.href='?report=1',true]
      ]);
    }
  }

  function resetAll(){
    [STATE_KEY,DECLINE_KEY,LOG_KEY,INTRO_KEY].forEach(k=>localStorage.removeItem(k));
    localStorage.removeItem('phantomPolicePuzzleComplete');
    state='start';
    declineCount=0;
    log=[];
    M.innerHTML='';
    clearTyping();
    clearActions();
    try{
      history.replaceState({},'',location.pathname);
    }catch(e){}
  }

  async function runConnectionIntro(){
    INTRO.hidden=false;
    APP.hidden=true;

    CONNECT.disabled=true;
    STATUS.classList.add('connecting');

    const steps=[
      ['認証情報を確認しています…',24,650],
      ['通信経路を暗号化しています…',52,800],
      ['怪盗関連事件特別捜査本部へ接続しています…',78,900],
      ['担当捜査員との接続を確立しています…',94,800],
      ['接続完了',100,550]
    ];

    for(const [label,pct,ms] of steps){
      STATUS_TEXT.textContent=label;
      PROGRESS.style.width=pct+'%';
      await wait(ms);
    }

    STATUS.classList.remove('connecting');
    STATUS.classList.add('done');
    localStorage.setItem(INTRO_KEY,'1');

    await wait(500);
    INTRO.animate(
      [{opacity:1},{opacity:0}],
      {duration:350,easing:'ease',fill:'forwards'}
    );
    await wait(330);
    INTRO.hidden=true;
    APP.hidden=false;
    restoreLog();
    restoreActions();

    if(state==='start' && log.length===0){
      setTimeout(introConversation,350);
    }
  }

  function showApp(){
    INTRO.hidden=true;
    APP.hidden=false;
    restoreLog();
    restoreActions();

    if(state==='start' && log.length===0){
      setTimeout(introConversation,350);
    }
  }

  if(qs.get('reset')==='1'){
    resetAll();
    INTRO.hidden=false;
    APP.hidden=true;
    CONNECT.addEventListener('click',runConnectionIntro,{once:true});
    return;
  }

  if(qs.get('report')==='1'){
    showApp();
    setTimeout(report,300);
    return;
  }

  if(qs.get('squirrel')==='1'){
    showApp();
    setTimeout(squirrel,300);
    return;
  }

  const forceIntro=qs.get('intro')==='1';
  const introSeen=localStorage.getItem(INTRO_KEY)==='1';

  if(!introSeen || forceIntro){
    INTRO.hidden=false;
    APP.hidden=true;
    CONNECT.addEventListener('click',runConnectionIntro,{once:true});
  }else{
    showApp();
  }
})();

</script>
</body>
</html>
