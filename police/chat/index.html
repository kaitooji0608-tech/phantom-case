<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>捜査協力者用 SECURE CHAT | 怪盗関連事件特別捜査本部</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="chat-page">
<div class="secure-chat-wrap">
  <header class="secure-topbar">
    <div class="secure-topbar-main">
      <div class="secure-agency"><span class="secure-seal">特</span><span><strong>怪盗関連事件特別捜査本部</strong><small>SECURE CONTACT CHANNEL</small></span></div>
      <div class="secure-connection">暗号化接続<br><b>● CONNECTED</b></div>
    </div>
  </header>
  <div class="secure-caption">捜査協力者専用チャット　／　発行済みQRコードからのアクセス</div>

</div>
