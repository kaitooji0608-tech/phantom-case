<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10233f" />
  <title>怪盗関連事件特別捜査本部 | Secure Chat</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="startScreen" class="start-screen" role="button" tabindex="0" aria-label="セキュアチャットを開始">
    <div class="start-screen-inner">
      <div class="start-emblem" aria-hidden="true">警</div>
      <div class="start-kicker">怪盗関連事件特別捜査本部</div>
      <h1>SECURE CHAT</h1>
      <p class="start-message">セキュアチャットを開始します</p>
      <div class="start-divider"></div>
      <p class="start-sub">この通信は捜査協力者向けの専用チャネルです</p>
      <div class="start-tap">画面をクリックして開始</div>
    </div>
  </div>

  <main class="app-shell">
    <section class="chat-app" aria-label="怪盗関連事件特別捜査本部 チャット">
      <header class="chat-header">
        <div class="header-badge" aria-hidden="true">警</div>
        <div class="header-copy">
          <div class="eyebrow">怪盗関連事件特別捜査本部</div>
          <div class="agent-row">
            <strong>相沢 直人</strong>
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text">オンライン</span>
          </div>
        </div>
      </header>

      <div class="security-strip">
        <span class="lock" aria-hidden="true">🔒</span>
        SECURE CHAT / CASE VICTIM CONTACT
      </div>

      <div id="messageList" class="message-list" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div id="typingIndicator" class="typing-wrap is-hidden" aria-label="相沢が入力中">
        <div class="avatar" aria-hidden="true">相</div>
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div id="actionArea" class="action-area" aria-live="polite"></div>

      <form id="chatForm" class="composer" autocomplete="off">
        <input
          id="chatInput"
          type="text"
          inputmode="text"
          placeholder="メッセージを入力"
          aria-label="メッセージを入力"
        />
        <button id="sendButton" type="submit">送信</button>
      </form>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
