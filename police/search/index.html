    <div class="session-strip" data-session-return><div class="session-strip-inner"><div class="session-copy"><strong>捜査協力セッション進行中</strong><br>相沢とのセキュアチャットへ戻れます。</div><a href="#">← 捜査チャットに戻る</a></div></div><main class="site-main"><div class="page-head"><small>SITE SEARCH</small><h1>サイト内検索</h1><p>事件記録、怪盗、スタッフ、公開ページを横断して検索します。</p></div><form class="global-search" action="./" method="get" style="max-width:760px;margin-bottom:18px"><input id="searchBox" name="q" placeholder="検索キーワードを入力してください"><button type="submit">🔍 検索</button></form><div id="summary" class="search-summary"></div><div id="results"></div></main><footer class="site-footer"><div class="footer-inner"><div class="footer-links"><a href="../about/">本部について</a><a href="../contact/">情報提供</a><a href="../search/">サイト内検索</a></div><div>© 2026 怪盗関連事件特別捜査本部</div></div></footer><script src="../../assets/police-session.js?v=9"></script><script src="../../assets/search-index.js?v=9"></script><script>const params=new URLSearchParams(location.search);const q=(params.get('q')||'').trim();const box=document.getElementById('searchBox');const results=document.getElementById('results');const summary=document.getElementById('summary');box.value=q;const norm=s=>s.toLowerCase().replace(/\s+/g,'');if(!q){summary.textContent='キーワードを入力してください。';}else{const nq=norm(q);const hits=window.POLICE_SEARCH_INDEX.filter(x=>norm(x.title+' '+x.text).includes(nq));summary.textContent=`「${q}」の検索結果：${hits.length}件`;if(!hits.length){results.innerHTML='<div class="no-result">該当する公開情報は見つかりませんでした。</div>';}else{results.innerHTML=hits.map(x=>`<article class="search-result"><small>${x.type}</small><h3><a href="${x.url}">${x.title}</a></h3><p>${x.text}</p></article>`).join('');}}</script></body></html>
