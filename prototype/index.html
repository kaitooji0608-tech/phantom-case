<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>警察チャット TEST</title><style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#294466;--text:#eef5ff;--muted:#91a5bf;--blue:#67adff;--red:#ff6f82;--green:#63dfa0;--gold:#dfbb70}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101c,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:22px 15px 60px}.top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:16px}.brand{font-weight:900;color:#bddbff}.secure{color:var(--green)}
.card{background:rgba(13,26,43,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.small{font-size:12px;color:var(--muted);line-height:1.6}.muted{color:var(--muted)}h1{font-size:25px;margin:5px 0 12px}h2{font-size:17px;margin:0 0 12px}
button,.btn{border:1px solid #3b6594;background:#102846;color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#0b1828;color:#c3d4e6;border-color:#2b455f}
input{width:100%;border:1px solid #365778;border-radius:12px;background:#081522;color:#fff;padding:13px 14px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid var(--gold);padding:10px 13px;background:#111b25;border-radius:8px;line-height:1.75}.danger{border-left-color:var(--red)}.badge{display:inline-block;border:1px solid #365574;border-radius:999px;padding:5px 9px;font-size:11px;color:#c6d8eb}

.chat{display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 14px;border-radius:15px;line-height:1.7;font-size:14px}.police{background:#12263e;border:1px solid #294b70}.me{background:#17392f;border:1px solid #2f6455;align-self:flex-end}.system{align-self:stretch;max-width:100%;text-align:center;background:#0a1522;border:1px dashed #35516f;color:#9fb4ca;font-size:12px}.controls{display:grid;gap:8px;margin-top:14px}.name{font-size:11px;color:#79baff;font-weight:800;margin-bottom:4px}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">怪盗特別捜査本部 / TEST</div><div class="secure">● SECURE</div></div>
<div class="card"><div class="small">機能検証版</div><h1>捜査官 佐伯</h1><div id="chat" class="chat"></div><div id="controls" class="controls"></div></div>
<button class="btn secondary" onclick="resetAll()">テスト進捗をリセット</button>
</div>
<script>
const K='phantom_arg_test_'; const chat=document.getElementById('chat'); const controls=document.getElementById('controls');
const get=(k,d='')=>localStorage.getItem(K+k)??d; const set=(k,v)=>localStorage.setItem(K+k,v);
function add(t,type='police'){const d=document.createElement('div');d.className='msg '+type;d.innerHTML=(type==='police'?'<div class="name">捜査官 佐伯</div>':'')+t;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
function clearC(){controls.innerHTML=''}
function addBtn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;controls.appendChild(b)}
function addInput(ph,fn){const i=document.createElement('input');i.placeholder=ph;const b=document.createElement('button');b.textContent='送信';b.onclick=()=>fn(i.value);i.onkeydown=e=>{if(e.key==='Enter')fn(i.value)};controls.append(i,b);i.focus()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function boot(){
 chat.innerHTML='';clearC();
 const stage=get('stage','intro'); const hacked=get('unregistered','0')==='1';
 if(hacked && stage!=='puzzle' && stage!=='done') return hackedFlow();
 if(stage==='intro'){
   add('突然のご連絡失礼いたします。こちらは、怪盗事件に関する捜査を担当している特別捜査本部です。');
   add('過去の事件記録との照合のため、まずご本人確認をさせてください。');
   add('怪盗による犯行が発生した<strong>日付</strong>を入力してください。');
   addInput('例：2022/10/02',checkDate);
 } else if(stage==='place'){
   add('日付を照合しました。続いて、事件が発生した<strong>都道府県</strong>を入力してください。');addInput('都道府県名',checkPlace);
 } else if(stage==='review'){
   add('本人照会は完了しています。CASE13の記録内容をご確認いただき、当時の状況と大きな相違がないか確認してください。');addBtn('警察データベースを開く',()=>location.href='db/');
 } else if(stage==='puzzle'){
   add('未登録資料について確認済みです。引き続き解析へのご協力をお願いします。');addBtn('解析対象ページを開く',()=>location.href='puzzle/');
 } else {add('テストフローは完了しています。');addBtn('DBを開く',()=>location.href='db/')}
}
function cleanDate(v){return v.trim().replace(/[年月-]/g,'/').replace(/日/g,'').replace(/\s/g,'')}
function checkDate(v){add(esc(v),'me');clearC();const n=cleanDate(v);
 if(n==='2022/10/2'||n==='2022/10/02'){set('stage','place');add('照合しました。');setTimeout(boot,350)}
 else if(n==='2022/10/3'||n==='2022/10/03'){add('その日は、お誕生日の日付ではありませんか？<br>確認したいのは、<strong>犯行が発生した日</strong>です。もう一度思い出してみてください。');addInput('犯行日',checkDate)}
 else{add('記録と一致しません。もう一度入力してください。');addInput('犯行日',checkDate)}}
function checkPlace(v){add(esc(v),'me');clearC();const n=v.trim().replace(/県$/,'');
 if(n==='高知'){add('……照合完了しました。');add('2022年10月2日、高知県で発生した<strong>CASE13「高知誕生日プレゼント盗難事件」</strong>の被害者の方ですね。');add('現在、過去の怪盗関連事件について記録の再整理を行っています。CASE13についても当時の資料をデータベースへ移行しました。');add('お手数ですが、事件記録をご確認いただき、<strong>当時の状況と大きな相違がないか</strong>確認してください。');set('stage','review');addBtn('事件記録を確認する',()=>location.href='db/case/013/')}
 else{add('記録と一致しません。都道府県名をご確認ください。');addInput('都道府県名',checkPlace)}}
function hackedFlow(){add('本人照会済み。CASE13の記録確認をお願いしていました。');add('SYSTEM：未登録資料へのアクセスを検知しました。','system');add('少々お待ちください。');add('あなたの閲覧セッションから<strong>CASE13-X</strong>という未登録資料へのアクセスが確認されました。');add('CASE13-Xというページを開きましたか？');
 addBtn('はい',()=>{clearC();add('はい','me');add('……その資料は、こちらで作成したものではありません。');add('システム管理側の記録にも、正式な捜査資料としての登録がありません。何者かがデータベース内へ追加した可能性があります。');add('さらに、ページ内容はCASE13の被害者であるあなたに向けられたものと考えられます。');add('安全性を確認したうえで、可能であれば引き続き解析にご協力いただきたいのですが、よろしいですか？');addBtn('協力する',()=>{clearC();add('協力します','me');set('stage','puzzle');add('ありがとうございます。解析対象へのアクセスを許可します。');addBtn('解析対象ページを開く',()=>location.href='puzzle/')})})}
function resetAll(){Object.keys(localStorage).filter(k=>k.startsWith(K)).forEach(k=>localStorage.removeItem(k));location.reload()}
boot();
</script></body></html>
