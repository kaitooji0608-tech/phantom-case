<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>怪盗事件DB TEST</title><style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#294466;--text:#eef5ff;--muted:#91a5bf;--blue:#67adff;--red:#ff6f82;--green:#63dfa0;--gold:#dfbb70}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101c,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:22px 15px 60px}.top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:16px}.brand{font-weight:900;color:#bddbff}.secure{color:var(--green)}
.card{background:rgba(13,26,43,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.small{font-size:12px;color:var(--muted);line-height:1.6}.muted{color:var(--muted)}h1{font-size:25px;margin:5px 0 12px}h2{font-size:17px;margin:0 0 12px}
button,.btn{border:1px solid #3b6594;background:#102846;color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#0b1828;color:#c3d4e6;border-color:#2b455f}
input{width:100%;border:1px solid #365778;border-radius:12px;background:#081522;color:#fff;padding:13px 14px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid var(--gold);padding:10px 13px;background:#111b25;border-radius:8px;line-height:1.75}.danger{border-left-color:var(--red)}.badge{display:inline-block;border:1px solid #365574;border-radius:999px;padding:5px 9px;font-size:11px;color:#c6d8eb}

.search{display:grid;grid-template-columns:1fr auto;gap:8px}.case{display:block;text-decoration:none;border:1px solid #263f5c;background:#0a1725;border-radius:13px;padding:13px;margin:9px 0}.case strong{display:block;margin-bottom:5px}.hidden{border-color:#725b2a;background:#211c10}
</style></head><body><div class="wrap"><div class="top"><div class="brand">怪盗特別捜査本部 / INCIDENT DATABASE</div><div class="secure">ACCESS LEVEL 1</div></div>
<div class="card"><div class="small">事件・関連資料検索</div><h1>怪盗事件データベース</h1><div class="search"><input id="q" placeholder="事件名・場所・被疑者・キーワード"><button onclick="runSearch()">検索</button></div><div class="small" style="margin-top:8px">テスト版：CASE13以外は空データです。</div></div>
<div class="card"><h2>登録事件</h2><div id="list"></div></div><div class="row"><a class="btn secondary" href="../index.html">捜査通信へ戻る</a></div></div>
<script>
const cases=Array.from({length:23},(_,i)=>{const n=i+1;return {no:n,title:n===13?'高知誕生日プレゼント盗難事件':'事件記録 '+String(n).padStart(2,'0')+'（未登録）',suspect:n===13?'怪盗ヘンタイおじさん':'—',summary:n===13?'2022年10月2日 / 高知県 / 誕生日プレゼント盗難':'内容未登録'}});
function render(arr,extra=''){document.getElementById('list').innerHTML=arr.map(c=>{const real=c.no===13;return `<a class="case" href="${real?'case/013/':'#'}" ${real?'':'onclick="return false"'}><strong>CASE ${String(c.no).padStart(2,'0')} / ${c.title}</strong><span class="small">${c.suspect} ｜ ${c.summary}</span></a>`}).join('')+extra}
function runSearch(){const q=document.getElementById('q').value.trim();let arr=!q?cases:cases.filter(c=>[c.title,c.suspect,c.summary,String(c.no)].join(' ').toLowerCase().includes(q.toLowerCase()));let extra='';if(q==='風評被害'||q==='一緒にするな') extra=`<a class="case hidden" href="../archive/kho-11-c/"><strong>非公開資料 1件</strong><span class="small">KHO-11-C / 被疑者本人からの抗議文</span></a>`;if(q.toUpperCase()==='JONATHAN ISEI') extra+=`<div class="case hidden"><strong>PERSON FILE J-01</strong><span class="small">テスト表示：本番では人物ファイルへリンク</span></div>`;render(arr,extra)}
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')runSearch()};render(cases);
</script></body></html>
