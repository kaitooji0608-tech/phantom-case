<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NEXT PUZZLE</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%}
    html{background:#030405}

    body{
      margin:0;
      min-height:100vh;
      color:#eceeef;
      background:
        radial-gradient(circle at 50% -10%,rgba(55,63,72,.14),transparent 42%),
        linear-gradient(180deg,#030405 0%,#080a0c 48%,#030405 100%);
      font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 3px,
          rgba(255,255,255,.018) 3px 4px
        ),
        radial-gradient(
          circle at 30% 20%,
          rgba(255,255,255,.025) 0 1px,
          transparent 1px 100%
        );
      background-size:auto,8px 8px;
      mix-blend-mode:screen;
    }

    .wrap{
      position:relative;
      z-index:1;
      width:min(760px,100%);
      margin:0 auto;
      padding:54px 18px 76px;
    }

    .transmission{
      border:1px solid #1a2025;
      background:
        linear-gradient(150deg,rgba(255,255,255,.012),transparent 46%),
        rgba(7,9,11,.86);
      box-shadow:
        0 32px 100px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.018);
      padding:52px 42px 50px;
    }

    .meta{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:40px;
      color:#59636c;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    .meta::before{
      content:"";
      width:6px;
      height:6px;
      border-radius:50%;
      background:#6c222b;
      box-shadow:0 0 12px rgba(108,34,43,.65);
      animation:pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{opacity:.3}
      50%{opacity:1}
    }

    .poem{
      margin:0;
      font-size:clamp(20px,3.8vw,29px);
      line-height:2.15;
      letter-spacing:.065em;
      font-weight:400;
      text-wrap:pretty;
    }

    .stanza{
      display:block;
      margin:0 0 34px;
      opacity:0;
      transform:translateY(8px);
      animation:reveal .7s ease forwards;
    }

    .stanza:nth-child(1){animation-delay:.10s}
    .stanza:nth-child(2){animation-delay:.35s}
    .stanza:nth-child(3){animation-delay:.60s}
    .stanza:last-child{margin-bottom:0}

    @keyframes reveal{
      to{
        opacity:1;
        transform:none;
      }
    }

    .poem strong{
      font-weight:500;
      color:#f3f4f5;
    }

    .latin{
      font-family:Georgia,"Times New Roman",serif;
      letter-spacing:.035em;
    }

    .divider{
      width:52px;
      height:1px;
      margin:46px 0 34px;
      background:linear-gradient(90deg,#3d444b,transparent);
    }

    .final-label{
      margin:0 0 9px;
      color:#56616a;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .final-copy{
      margin:0 0 18px;
      color:#8b949c;
      font-size:13px;
      line-height:1.8;
      letter-spacing:.035em;
    }

    .answer-form{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:stretch;
    }

    .answer-form input{
      width:100%;
      min-width:0;
      border:1px solid #2b333a;
      border-radius:2px;
      outline:none;
      padding:14px 15px;
      color:#f1f2f3;
      background:#050708;
      font:600 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.12em;
      text-transform:uppercase;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }

    .answer-form input:focus{
      border-color:#56626c;
      background:#080b0d;
      box-shadow:0 0 0 3px rgba(86,98,108,.09);
    }

    .answer-form button{
      border:1px solid #313941;
      border-radius:2px;
      padding:0 18px;
      color:#d7dadd;
      background:#11161a;
      font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.16em;
      cursor:pointer;
      transition:background .18s,border-color .18s,color .18s;
    }

    .answer-form button:hover{
      background:#181e23;
      border-color:#4a555f;
      color:#fff;
    }

    .answer-status{
      min-height:24px;
      margin:10px 0 0;
      color:#6f7880;
      font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.08em;
    }

    .answer-status.error{color:#8a5057}

    .foot{
      margin:34px 0 0;
      color:#3f474e;
      font:9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.18em;
    }

    @media(max-width:580px){
      .wrap{padding:20px 12px 48px}
      .transmission{padding:38px 24px 40px}
      .meta{margin-bottom:30px}
      .poem{line-height:2}
      .stanza{margin-bottom:28px}
      .answer-form{grid-template-columns:1fr}
      .answer-form button{min-height:46px}
    }

    @media(prefers-reduced-motion:reduce){
      .stanza,.meta::before{animation:none}
      .stanza{opacity:1;transform:none}
    }

    .transmission.ending{
      min-height:72vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .transmission.ending > :not(.ending-stage){
      display:none;
    }

    .ending-stage{
      display:none;
      min-height:440px;
    }

    .transmission.ending .ending-stage{
      display:block;
    }

    .ending-head{
      margin:0 0 30px;
      color:#59636c;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.22em;
    }

    .ending-log{
      display:grid;
      gap:18px;
    }

    .ending-line{
      margin:0;
      opacity:0;
      transform:translateY(5px);
      color:#e6e8ea;
      font-size:clamp(17px,3.2vw,23px);
      line-height:1.9;
      letter-spacing:.04em;
      transition:opacity .28s ease,transform .28s ease;
    }

    .ending-line.show{
      opacity:1;
      transform:none;
    }

    .ending-line.ojisan{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      color:#f0e7de;
    }

    .ending-line.birthday{
      margin-top:10px;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      font-size:clamp(24px,5vw,38px);
      font-weight:800;
      letter-spacing:.04em;
      color:#fff;
    }

    .ending-line.report{
      margin-top:14px;
      padding-top:22px;
      border-top:1px solid #242b31;
      color:#cfd4d8;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      font-size:15px;
    }

    .secret-link{
      display:none;
      width:fit-content;
      margin:26px 0 6px;
      padding:12px 15px;
      border:1px solid #3a434b;
      border-radius:2px;
      color:#e9ecee;
      background:#11161a;
      text-decoration:none;
      font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.16em;
    }

    .secret-link.show{display:inline-block}

    .secret-link:hover{
      background:#181e23;
      border-color:#59656f;
    }

    .glitch-flash{
      position:fixed;
      inset:0;
      z-index:9999;
      pointer-events:none;
      opacity:0;
      background:#000;
    }

    .glitch-flash.active{
      animation:endGlitch .65s steps(2,end);
    }

    @keyframes endGlitch{
      0%{opacity:0}
      12%{opacity:1;background:#000}
      24%{opacity:.82;background:repeating-linear-gradient(0deg,#d7d7d7 0 1px,#111 1px 4px)}
      38%{opacity:1;background:#000}
      52%{opacity:.65;background:repeating-linear-gradient(90deg,#777 0 2px,#000 2px 7px)}
      68%{opacity:1;background:#000}
      100%{opacity:0}
    }

  </style>
</head>

<body>
  <main class="wrap">
    <section class="transmission">
      <div class="meta">NEXT PUZZLE / PRIVATE TRANSMISSION</div>

      <div class="poem" aria-label="次の謎">
        <span class="stanza">
          十一の獣が並ぶ場所。<br>
          まずは、その群れの下へ。
        </span>

        <span class="stanza">
          次は、三と四の秩序に並ぶ<br>
          十二の黒き盤の下。
        </span>

        <span class="stanza">
          そして最後に、<span class="latin">Karl Blossfeldt</span>。<br>
          もの言わぬ命を、光の中に閉じ込めた男。<br>
          その一枚を纏う箱の中を探せ。
        </span>
      </div>

      <div class="divider"></div>

      <p class="final-label">FINAL ANSWER</p>
      <p class="final-copy">
        三つの場所で見つけたものから、最後の答えを導け。
      </p>

      <form class="answer-form" id="final-answer-form">
        <input
          id="final-answer"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="ENTER ANSWER"
          aria-label="最終回答"
        >
        <button type="submit">ANSWER</button>
      </form>

      <p class="answer-status" id="answer-status" aria-live="polite"></p>

      <p class="foot">THREE PLACES / ONE ANSWER</p>

      <section class="ending-stage" id="ending-stage" aria-live="polite">
        <p class="ending-head">FINAL TRANSMISSION</p>
        <div class="ending-log" id="ending-log"></div>
        <a
          class="secret-link"
          id="secret-link"
          href="../../police/secret/"
          target="_blank"
          rel="noopener noreferrer"
        >SECRET INDEX</a>
      </section>
    </section>
  </main>

  <div class="glitch-flash" id="glitch-flash" aria-hidden="true"></div>

  <script>
    (() => {
      // DEBUG: エンディング確認用にかなり短くしている。
      // 本番では必要に応じて ENDING_DEBUG_FAST=false にする。
      const ENDING_DEBUG_FAST = true;
      const FINAL_ANSWERS = ['HAPPY BIRTHDAY'];

      const form = document.getElementById('final-answer-form');
      const input = document.getElementById('final-answer');
      const status = document.getElementById('answer-status');
      const transmission = document.querySelector('.transmission');
      const endingLog = document.getElementById('ending-log');
      const secretLink = document.getElementById('secret-link');
      const flash = document.getElementById('glitch-flash');

      const normalize = value =>
        String(value || '')
          .trim()
          .replace(/[\s　_-]/g, '')
          .toUpperCase();

      const wait = ms =>
        new Promise(resolve =>
          setTimeout(resolve, ENDING_DEBUG_FAST ? Math.min(ms, 220) : ms)
        );

      async function addLine(text, className=''){
        const p = document.createElement('p');
        p.className = 'ending-line' + (className ? ' ' + className : '');
        p.textContent = text;
        endingLog.appendChild(p);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => p.classList.add('show'));
        });

        p.scrollIntoView({behavior:'smooth',block:'nearest'});
        await wait(1200);
      }

      async function glitch(){
        flash.classList.remove('active');
        void flash.offsetWidth;
        flash.classList.add('active');
        await wait(900);
        flash.classList.remove('active');
      }

      async function runEnding(){
        transmission.classList.add('ending');

        await addLine('見事だ。');
        await addLine('すべての謎を解いたようだな。');
        await addLine('ならば約束通り、お前から預かったものを返してやろう。');
        await wait(900);
        await addLine('……その前に。');

        await glitch();

        await addLine('……って言いたいところなんだけどネ😅','ojisan');
        await addLine('もうこの喋り方、疲れたヨ〜〜〜‼️🤣','ojisan');
        await addLine('お久しぶり〜〜😎✨','ojisan');
        await addLine('怪盗ヘンタイおじさんだヨ〜〜〜‼️','ojisan');

        await addLine('GLITCHくんの名前、ちょ〜〜っとだけ借りちゃったヨ🤣','ojisan');

        await wait(800);
        await addLine('さてさて……','ojisan');
        await addLine('ボクが盗んだ「大切なもの」なんだけどサ😏','ojisan');
        await addLine('そんなものありません〜〜‼️🤣🤣🤣','ojisan');
        await addLine('お騒がせしました〜〜💦💦','ojisan');

        await wait(700);
        await addLine('代わりと言っちゃなんだけどサ〜','ojisan');
        await addLine('警察さんたちの闇、まだまだ深そうなんだよネ〜👀','ojisan');
        await addLine('今回見つけたヤツ以外にも、普通に見てるだけじゃ出てこないページがあるみたい😏','ojisan');
        await addLine('こんなのも見つけたから、置いとくネ👇','ojisan');

        secretLink.classList.add('show');
        secretLink.scrollIntoView({behavior:'smooth',block:'nearest'});
        await wait(1000);

        await addLine('これは完全にオマケだからネ‼️ 暇なときにでも調べてみて〜🤣','ojisan');

        await wait(1000);
        await addLine('ということで……','ojisan');
        await addLine('🎉🎂 HAPPY BIRTHDAY 🎂🎉','birthday');
        await addLine('30歳、おめでとう〜〜〜‼️🥳✨','ojisan');
        await addLine('今回も最後まで付き合ってくれてありがとネ😎','ojisan');
        await addLine('またそのうち、何か盗みに来るかもしれないから、戸締まりはちゃんとしておくんだヨ〜〜🤣','ojisan');

        await wait(900);
        await addLine('あ。そういえば忘れてた😳','ojisan');
        await addLine('相沢クン、まだ事件の続きだと思ってるんじゃない⁉️🤣','ojisan');
        await addLine('警察さんとのチャットに戻って、「謎が全部解けました」って教えてあげてネ〜〜👋😎','report');
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();

        const value = normalize(input.value);

        if (!value) {
          status.className = 'answer-status error';
          status.textContent = '答えを入力せよ。';
          return;
        }

        if (!FINAL_ANSWERS.map(normalize).includes(value)) {
          status.className = 'answer-status error';
          status.textContent = '違う。もう一度考えろ。';
          return;
        }

        input.disabled = true;
        form.querySelector('button').disabled = true;
        status.className = 'answer-status';
        status.textContent = 'FINAL ANSWER ACCEPTED';

        localStorage.setItem('phantomCaseFinalSolved','1');

        await wait(700);
        runEnding();
      });
    })();
  </script>
</body>
</html>
