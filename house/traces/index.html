<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../assets/common.css?v=7">
<title>残された3つの痕跡</title>
</head>
<body>
<div class="shell"><div class="panel">
  <div class="topbar">
    <div class="kicker">HOUSE TRACE SEARCH</div>
    <h1>残された3つの痕跡</h1>
  </div>

  <div class="content">
    <div id="locked" class="card hidden">
      <span class="status lock">LOCKED</span>
      <p>まだこのページは解放されていません。</p>
      <a class="btn secondary" href="../../police/chat/">警察チャットへ戻る</a>
    </div>

    <div id="stage" class="hidden">
      <div class="card">
        <p>
          謎を解くと、痕跡が残されている<strong>場所</strong>が分かります。<br>
          実際にその場所を探し、見つけたカードに書かれている<strong>キーワード</strong>を入力してください。
        </p>

        <strong><span id="traceCount">0</span>/3 FOUND</strong>
        <div class="progress"><div id="traceBar"></div></div>

        <div class="dev-note">
          現在は動作確認用の仮問題・仮キーワードです。
          あとで本番の謎／場所／キーワードに差し替えます。
        </div>
      </div>

      <div id="traceCards"></div>

      <div id="endingCard" class="card hidden">
        <div class="system">ALL TRACES FOUND</div>
        <p>3つすべての痕跡を確認しました。</p>
        <a class="btn ojisan" href="../../ending/">最後のページへ</a>
      </div>
    </div>
  </div>
</div></div>

<script src="../../assets/state-v7.js"></script>
<script>
const traceData={
  one:{
    title:"TRACE 01",
    puzzle:"テスト問題：食べ物を冷たく保存する場所は？",
    answers:["冷蔵庫","れいぞうこ"],
    location:"冷蔵庫",
    keywords:["マンボ"]
  },
  two:{
    title:"TRACE 02",
    puzzle:"テスト問題：眠るときに使う場所は？",
    answers:["ベッド","べっど"],
    location:"ベッド",
    keywords:["サマンサ"]
  },
  three:{
    title:"TRACE 03",
    puzzle:"テスト問題：靴を脱いで家に入る場所は？",
    answers:["玄関","げんかん"],
    location:"玄関",
    keywords:["おったまげ"]
  }
};

const norm=v=>v.trim().replace(/\s+/g,"");

function allTraces(s){
  return s.traces.one && s.traces.two && s.traces.three;
}

function renderTraceCards(){
  const s=PhantomState.load();
  const container=document.getElementById("traceCards");
  container.innerHTML="";

  Object.entries(traceData).forEach(([key,data])=>{
    const locationSolved=!!s.traceLocations[key];
    const found=!!s.traces[key];

    const card=document.createElement("div");
    card.className="card trace-card"+(found?" complete":"");
    card.id="trace-"+key;

    card.innerHTML=`
      <span class="status ${found?"ok":locationSolved?"ok":"lock"}">
        ${found?"TRACE FOUND":locationSolved?"場所判明":"謎未解決"}
      </span>
      <h3>${data.title}</h3>

      <span class="step-label">STEP 1 / 謎を解く</span>
      <p>${data.puzzle}</p>

      <form class="trace-riddle" data-trace="${key}">
        <div class="answer-row">
          <input
            autocomplete="off"
            enterkeyhint="done"
            placeholder="謎の答えを入力"
            ${locationSolved?"disabled":""}
          >
          <button class="btn" type="submit" ${locationSolved?"disabled":""}>回答する</button>
        </div>
        <div class="answer riddle-msg"></div>
      </form>

      <div class="location-box ${locationSolved?"":"hidden"}" id="location-${key}">
        <span class="step-label">STEP 2 / 場所を探す</span>
        <span>痕跡がある場所</span>
        <span class="location-name">${data.location}</span>
        <p class="muted">実際にこの場所を調べてください。そこに怪盗が残したカードがある想定です。</p>

        <div class="keyword-box">
          <span class="step-label">STEP 3 / カードのキーワード</span>
          <form class="trace-keyword" data-trace="${key}">
            <div class="answer-row">
              <input
                autocomplete="off"
                enterkeyhint="done"
                placeholder="カードのキーワードを入力"
                ${found?"disabled":""}
              >
              <button class="btn" type="submit" ${found?"disabled":""}>キーワードを確認</button>
            </div>
            <div class="answer keyword-msg">${found?"確認済み。":""}</div>
          </form>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  bindTraceForms();
}

function bindTraceForms(){
  document.querySelectorAll(".trace-riddle").forEach(form=>{
    form.addEventListener("submit",e=>{
      e.preventDefault();

      const key=form.dataset.trace;
      const data=traceData[key];
      const input=form.querySelector("input");
      const msg=form.querySelector(".riddle-msg");
      const value=norm(input.value);

      if(data.answers.some(a=>norm(a)===value)){
        PhantomState.update(s=>{s.traceLocations[key]=true;});
        msg.textContent="正解。場所が判明しました。";
        msg.style.color="#177245";
        render();

        setTimeout(()=>{
          document.getElementById("location-"+key)?.scrollIntoView({
            behavior:"smooth",
            block:"center"
          });
        },120);
      }else{
        msg.textContent="違うようです。";
        msg.style.color="#8b2733";
      }
    });
  });

  document.querySelectorAll(".trace-keyword").forEach(form=>{
    form.addEventListener("submit",e=>{
      e.preventDefault();

      const key=form.dataset.trace;
      const data=traceData[key];
      const input=form.querySelector("input");
      const msg=form.querySelector(".keyword-msg");
      const value=norm(input.value);

      if(data.keywords.some(k=>norm(k)===value)){
        PhantomState.update(s=>{s.traces[key]=true;});
        msg.textContent="TRACE FOUND";
        msg.style.color="#177245";
        render();

        const current=PhantomState.load();
        if(allTraces(current)){
          setTimeout(()=>{
            document.getElementById("endingCard")?.scrollIntoView({
              behavior:"smooth",
              block:"center"
            });
          },150);
        }
      }else{
        msg.textContent="キーワードが一致しません。";
        msg.style.color="#8b2733";
      }
    });
  });
}

function render(){
  const s=PhantomState.load();

  document.getElementById("locked").classList.toggle("hidden",!!s.traceSearchUnlocked);
  document.getElementById("stage").classList.toggle("hidden",!s.traceSearchUnlocked);

  if(!s.traceSearchUnlocked) return;

  renderTraceCards();

  const current=PhantomState.load();
  const count=["one","two","three"].filter(k=>current.traces[k]).length;

  document.getElementById("traceCount").textContent=count;
  document.getElementById("traceBar").style.width=(count/3*100)+"%";

  if(allTraces(current)){
    if(!current.endingUnlocked){
      PhantomState.update(x=>{x.endingUnlocked=true;});
    }
    document.getElementById("endingCard").classList.remove("hidden");
  }else{
    document.getElementById("endingCard").classList.add("hidden");
  }
}

render();
</script>
</body>
</html>
