<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>怪盗特別捜査本部</title>
<style>
  :root{
    --bg:#07111f;
    --panel:#0c1727;
    --panel2:#111f33;
    --line:#213653;
    --text:#eef5ff;
    --muted:#91a5bf;
    --accent:#61a9ff;
    --accent2:#2d78d4;
    --danger:#ff4f64;
    --thief:#d8b36a;
    --good:#59d49a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(50,110,190,.18), transparent 34%),
      linear-gradient(180deg,#06101d 0%,#09131f 100%);
    color:var(--text);
    overflow:hidden;
  }
  .app{
    height:100dvh;
    max-width:560px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:rgba(6,15,27,.96);
    box-shadow:0 0 80px rgba(0,0,0,.5);
    position:relative;
  }
  .topbar{
    padding:calc(10px + env(safe-area-inset-top)) 14px 11px;
    border-bottom:1px solid var(--line);
    background:rgba(7,17,31,.94);
    backdrop-filter:blur(14px);
    display:flex;
    align-items:center;
    gap:10px;
    z-index:3;
  }
  .badge{
    width:40px;height:40px;border-radius:50%;
    border:1px solid #3c5f89;
    background:
      radial-gradient(circle,#2e6db3 0 23%,transparent 24%),
      conic-gradient(from 45deg,#274a72,#11243c,#274a72,#11243c,#274a72);
    display:grid;place-items:center;
    box-shadow:0 0 20px rgba(61,132,219,.18);
    flex:0 0 auto;
  }
  .badge:after{content:"捜";font-weight:800;font-size:16px}
  .headcopy{min-width:0;flex:1}
  .title{font-size:14px;font-weight:800;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:11px;color:var(--good);margin-top:2px}
  .case{
    font-size:10px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 8px;
  }

  #chat{
    flex:1;
    overflow:auto;
    padding:18px 13px 130px;
    scroll-behavior:smooth;
  }
  .system{
    text-align:center;
    color:#70849d;
    font-size:11px;
    margin:8px 0 18px;
    letter-spacing:.08em;
  }
  .row{display:flex;margin:8px 0;gap:8px;align-items:flex-end}
  .row.me{justify-content:flex-end}
  .avatar{
    width:28px;height:28px;border-radius:50%;
    display:grid;place-items:center;
    font-size:11px;font-weight:800;
    background:#173458;border:1px solid #2d527d;
    flex:0 0 auto;
  }
  .avatar.thief{background:#2c2418;border-color:#765f35;color:#f0d190}
  .bubble{
    max-width:78%;
    padding:10px 12px;
    border-radius:15px;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
    animation:pop .23s ease-out;
    box-shadow:0 7px 18px rgba(0,0,0,.11);
  }
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .police .bubble{background:var(--panel2);border:1px solid #1b3453;border-bottom-left-radius:5px}
  .thiefrow .bubble{
    background:#1e1b17;border:1px solid #59492d;border-bottom-left-radius:5px;color:#f3dfb6;
    text-shadow:0 0 10px rgba(216,179,106,.12);
  }
  .me .bubble{
    background:linear-gradient(180deg,#2f80df,#276ec1);
    border-bottom-right-radius:5px;
  }
  .meta{font-size:10px;color:#6f829b;margin:3px 38px 0}
  .me + .meta{text-align:right}
  .typing{
    display:inline-flex;gap:4px;align-items:center;
    padding:12px 13px;background:var(--panel2);border:1px solid #1b3453;border-radius:15px;border-bottom-left-radius:5px
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#8ea4bf;animation:b 1.1s infinite}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}

  .composer{
    position:absolute;left:0;right:0;bottom:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(7,17,31,.25),rgba(7,17,31,.98) 24%);
    z-index:4;
  }
  .quick{display:flex;gap:8px;overflow:auto;padding:6px 0 8px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;
    border:1px solid #365b89;color:#cfe4ff;background:#0e213a;
    border-radius:999px;padding:9px 12px;font-size:13px;cursor:pointer;
  }
  .chip.danger{border-color:#69502f;background:#221c14;color:#efd29a}
  .inputline{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;background:#0d1929;color:white;font-size:15px;outline:none;
  }
  input[type=text]:focus{border-color:#3f72ad}
  button.send{
    border:0;border-radius:14px;padding:0 16px;font-weight:800;
    color:white;background:#2c78cf;cursor:pointer
  }
  button:disabled{opacity:.45;cursor:not-allowed}

  .modal{
    position:absolute;inset:0;background:rgba(2,8,14,.78);backdrop-filter:blur(8px);
    z-index:10;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal.show{display:flex}
  .card{
    width:min(100%,420px);background:#0c1727;border:1px solid #294466;
    border-radius:20px;padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.45)
  }
  .eyebrow{font-size:11px;letter-spacing:.18em;color:#80a9d7}
  .card h2{margin:7px 0 8px;font-size:22px}
  .card p{color:#9fb1c8;line-height:1.7;font-size:14px}
  .primary{
    width:100%;border:0;border-radius:14px;padding:13px 15px;
    color:white;background:#2876cc;font-weight:800;font-size:15px;cursor:pointer
  }
  .secondary{
    width:100%;margin-top:9px;border:1px solid #294466;border-radius:14px;padding:12px 15px;
    color:#c6d7eb;background:#101d2e;font-weight:700;cursor:pointer
  }
  .evidence{
    margin:10px 0;border:1px dashed #365474;border-radius:14px;padding:12px;background:#0a1422
  }
  .preview{width:100%;border-radius:12px;margin-top:10px;display:none;max-height:280px;object-fit:cover}
  .takeover{
    position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),
      radial-gradient(circle at 50% 50%,rgba(216,179,106,.08),transparent 45%);
  }
  .takeover.flash{animation:glitch .9s ease-out}
  @keyframes glitch{
    0%{opacity:0}10%{opacity:.95;transform:translateX(-4px)}18%{opacity:.15;transform:translateX(5px)}
    28%{opacity:.8;transform:translateX(-2px)}45%{opacity:.12}62%{opacity:.65}100%{opacity:0}
  }
  .reset{
    border:0;background:transparent;color:#607b9d;font-size:11px;cursor:pointer;padding:5px
  }
  .notice{
    margin:12px 0;padding:11px 12px;border:1px solid #39516b;border-radius:11px;
    background:#0b1625;color:#aabbd0;font-size:12px;line-height:1.6
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="badge"></div>
    <div class="headcopy">
      <div class="title" id="headerTitle">怪盗特別捜査本部 / 捜査官 佐伯</div>
      <div class="status" id="headerStatus">● 暗号化通信 接続中</div>
    </div>
    <div class="case">CASE #02</div>
    <button class="reset" id="resetBtn" title="最初から">↺</button>
  </header>

  <main id="chat"></main>

  <div class="composer">
    <div class="quick" id="quick"></div>
    <div class="inputline">
      <input id="textInput" type="text" autocomplete="off" placeholder="メッセージを入力">
      <button class="send" id="sendBtn">送信</button>
    </div>
  </div>

  <div class="takeover" id="takeover"></div>

  <div class="modal show" id="startModal">
    <div class="card">
      <div class="eyebrow">SECURE POLICE CHANNEL</div>
      <h2>怪盗特別捜査本部</h2>
      <p>前回の誕生日プレゼント盗難事件に関連する可能性のある事案が確認されました。本人確認後、担当捜査官との通信を開始します。</p>
      <button class="primary" id="startBtn">通信を開始</button>
      <button class="secondary" id="resumeBtn" style="display:none">前回の続きから</button>
    </div>
  </div>

  <div class="modal" id="photoModal">
    <div class="card">
      <div class="eyebrow">EVIDENCE CAPTURE</div>
      <h2>証拠写真を送信</h2>
      <p>この試作品では写真は外部へ送信されず、この端末のブラウザ内でのみ表示されます。</p>
      <div class="evidence">
        <input id="photoInput" type="file" accept="image/*" capture="environment">
        <img id="preview" class="preview" alt="証拠写真プレビュー">
      </div>
      <button class="primary" id="submitPhoto" disabled>この写真を送る</button>
      <button class="secondary" id="cancelPhoto">キャンセル</button>
    </div>
  </div>
</div>

<script>
/*
==========================================================
  ここを編集するとストーリーを差し替えられます
==========================================================
*/
const CONFIG = {
  investigator: "佐伯",
  policeTitle: "怪盗特別捜査本部",
  caseNo: "CASE #02",
  victimName: "あなた",
  thiefName: "UNKNOWN",
};

const chat = document.getElementById("chat");
const quick = document.getElementById("quick");
const input = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const takeover = document.getElementById("takeover");
const headerTitle = document.getElementById("headerTitle");
const headerStatus = document.getElementById("headerStatus");
let stage = 0;
let busy = false;
let currentSender = "police";

const wait = ms => new Promise(r => setTimeout(r, ms));
const now = () => new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});

function save(){
  localStorage.setItem("phantomChatStage", String(stage));
}
function scrollBottom(){
  chat.scrollTop = chat.scrollHeight;
}
function sys(text){
  const d=document.createElement("div");
  d.className="system";
  d.textContent=text;
  chat.appendChild(d);
  scrollBottom();
}
function msg(text, who="police"){
  const row=document.createElement("div");
  row.className="row " + (who==="me" ? "me" : who==="thief" ? "thiefrow" : "police");

  if(who!=="me"){
    const av=document.createElement("div");
    av.className="avatar " + (who==="thief" ? "thief" : "");
    av.textContent=who==="thief" ? "?" : "警";
    row.appendChild(av);
  }

  const b=document.createElement("div");
  b.className="bubble";
  b.textContent=text;
  row.appendChild(b);
  chat.appendChild(row);

  const m=document.createElement("div");
  m.className="meta";
  m.textContent=(who==="me" ? "あなた" : who==="thief" ? "UNKNOWN" : "捜査官 "+CONFIG.investigator) + "  " + now();
  chat.appendChild(m);
  scrollBottom();
}

function typing(who="police"){
  return new Promise(async resolve=>{
    const row=document.createElement("div");
    row.className="row " + (who==="thief" ? "thiefrow" : "police");
    const av=document.createElement("div");
    av.className="avatar " + (who==="thief" ? "thief" : "");
    av.textContent=who==="thief" ? "?" : "警";
    row.appendChild(av);
    const t=document.createElement("div");
    t.className="typing";
    t.innerHTML='<i class="dot"></i><i class="dot"></i><i class="dot"></i>';
    row.appendChild(t);
    chat.appendChild(row);
    scrollBottom();
    await wait(900 + Math.random()*850);
    row.remove();
    resolve();
  });
}
function chips(items=[]){
  quick.innerHTML="";
  for(const item of items){
    const b=document.createElement("button");
    b.className="chip" + (item.danger ? " danger" : "");
    b.textContent=item.label;
    b.onclick=()=>handleUser(item.label,item.action);
    quick.appendChild(b);
  }
}
async function bot(text, who="police"){
  busy=true; sendBtn.disabled=true;
  await typing(who);
  msg(text,who);
  busy=false; sendBtn.disabled=false;
}
function user(text){
  msg(text,"me");
  input.value="";
  chips([]);
}
function glitch(){
  takeover.classList.remove("flash");
  void takeover.offsetWidth;
  takeover.classList.add("flash");
  if(navigator.vibrate) navigator.vibrate([70,50,110,60,160]);
}
function setPolice(){
  currentSender="police";
  headerTitle.textContent = CONFIG.policeTitle + " / 捜査官 " + CONFIG.investigator;
  headerStatus.textContent="● 暗号化通信 接続中";
  headerStatus.style.color="var(--good)";
}
function setThief(){
  currentSender="thief";
  headerTitle.textContent="UNKNOWN CONNECTION";
  headerStatus.textContent="● 通信経路が不明です";
  headerStatus.style.color="var(--thief)";
}

async function startFlow(){
  stage=1; save(); setPolice();
  sys("暗号化通信を確立しました");
  await bot("こちら怪盗特別捜査本部、捜査官の"+CONFIG.investigator+"です。");
  await bot("昨年の誕生日プレゼント盗難事件について、捜査記録を確認しています。");
  await bot("まず確認です。現在、ご自宅にいますか？");
  chips([
    {label:"はい、自宅です", action:"home_yes"},
    {label:"いいえ", action:"home_no"}
  ]);
}

async function handleUser(label, action=null){
  if(busy) return;
  user(label);

  if(action==="home_yes" || stage===1){
    stage=2; save();
    await bot("承知しました。今朝、ご自宅周辺で前回の事件と同一の署名が確認されました。");
    await bot("玄関付近に、普段はない物が置かれていないか確認してください。");
    chips([
      {label:"何かあります", action:"found"},
      {label:"何もありません", action:"nothing"}
    ]);
    return;
  }

  if(action==="home_no"){
    await bot("承知しました。帰宅後、この通信を再開してください。");
    chips([{label:"自宅に戻りました", action:"home_yes"}]);
    return;
  }

  if(action==="nothing"){
    await bot("見落としの可能性があります。玄関扉、靴箱、郵便受け付近をもう一度確認してください。");
    chips([{label:"見つけました", action:"found"}]);
    return;
  }

  if(action==="found" || stage===2){
    stage=3; save();
    await bot("触れずに、まず外観を確認してください。");
    await bot("可能であれば証拠写真を1枚送ってください。");
    chips([{label:"証拠写真を送る", action:"photo"}]);
    return;
  }

  if(action==="photo"){
    document.getElementById("photoModal").classList.add("show");
    return;
  }

  if(action==="search_house"){
    stage=5; save();
    await bot("では、家の中を確認します。怪盗が残す痕跡には一定のパターンがあります。");
    await bot("最初に『鏡』を確認してください。そこに、前回の事件と同じ印がないか探してください。");
    chips([
      {label:"怪盗の印があります", action:"mark_found"},
      {label:"まだ見つかりません", action:"mark_notfound"}
    ]);
    return;
  }

  if(action==="mark_notfound"){
    await bot("鏡そのものだけでなく、鏡の縁・裏側・近くの壁も確認してください。");
    chips([{label:"見つけました", action:"mark_found"}]);
    return;
  }

  if(action==="mark_found"){
    stage=6; save();
    await bot("……確認しました。");
    await wait(450);
    glitch();
    sys("通信状態が不安定です");
    await wait(500);
    setThief();
    await bot("久しぶりだな。","thief");
    await bot("警察とのおしゃべりは楽しかったか？","thief");
    await bot("この家には、もう入らせてもらった。","thief");
    chips([{label:"あなたは誰？", action:"who"}, {label:"何が目的？", action:"purpose", danger:true}]);
    return;
  }

  if(action==="who" || action==="purpose" || stage===6){
    stage=7; save();
    if(action==="who") await bot("忘れたとは言わせない。前回、君の誕生日プレゼントを盗んだ者だ。","thief");
    else await bot("目的を知りたければ、私がこの家に残した痕跡を追うことだ。","thief");
    await bot("まずは鏡の近くをもう一度調べろ。そこに『最初の鍵』を残した。","thief");
    await wait(400);
    glitch();
    sys("UNKNOWN CONNECTION が切断されました");
    setPolice();
    await bot("こちら"+CONFIG.investigator+"。通信を復旧しました。今の相手は……怪盗本人です。");
    await bot("以降はこちらであなたを誘導します。見つけたものはすべてこのチャットに報告してください。");
    chips([{label:"捜査を続ける", action:"continue_case"}]);
    return;
  }

  if(action==="continue_case"){
    stage=8; save();
    await bot("試作品はここまでです。");
    const d=document.createElement("div");
    d.className="notice";
    d.innerHTML="<strong>ここから自由に拡張できます。</strong><br>次の謎、NFC、QR、GPS、AR、実物の鍵、Webページ遷移などをこのチャットから順番に起動できます。";
    chat.appendChild(d); scrollBottom();
    chips([{label:"最初から試す", action:"restart"}]);
    return;
  }

  if(action==="restart"){
    resetAll();
    return;
  }

  // 自由入力への簡易リアクション
  const t=label.toLowerCase();
  if(t.includes("見つ") || t.includes("あった") || t.includes("あります")){
    await bot("確認しました。状況を記録します。続けて周囲を確認してください。");
  }else{
    await bot("受信しました。捜査記録に追加します。");
  }
}

sendBtn.onclick=()=>{
  const t=input.value.trim();
  if(t) handleUser(t);
};
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.isComposing) sendBtn.click();
});

const startModal=document.getElementById("startModal");
const resumeBtn=document.getElementById("resumeBtn");
document.getElementById("startBtn").onclick=()=>{
  startModal.classList.remove("show");
  chat.innerHTML="";
  startFlow();
};
document.getElementById("resetBtn").onclick=()=>resetAll();

function resetAll(){
  localStorage.removeItem("phantomChatStage");
  stage=0; chat.innerHTML=""; chips([]); setPolice();
  startModal.classList.add("show");
  resumeBtn.style.display="none";
}

const saved=Number(localStorage.getItem("phantomChatStage")||0);
if(saved>0) resumeBtn.style.display="block";
resumeBtn.onclick=()=>{
  startModal.classList.remove("show");
  chat.innerHTML="";
  stage=0;
  startFlow();
};

// 証拠写真
const photoModal=document.getElementById("photoModal");
const photoInput=document.getElementById("photoInput");
const preview=document.getElementById("preview");
const submitPhoto=document.getElementById("submitPhoto");

photoInput.onchange=()=>{
  const f=photoInput.files?.[0];
  if(!f) return;
  const url=URL.createObjectURL(f);
  preview.src=url;
  preview.style.display="block";
  submitPhoto.disabled=false;
};
document.getElementById("cancelPhoto").onclick=()=>photoModal.classList.remove("show");
submitPhoto.onclick=async()=>{
  photoModal.classList.remove("show");
  user("証拠写真を送信しました");
  stage=4; save();
  await bot("画像を受信しました。解析しています……");
  await wait(900);
  sys("画像解析：一致候補を検出");
  await bot("確認しました。この印は、前回の事件現場で確認されたものと一致します。");
  await bot("侵入者がすでに家の中へ入った可能性があります。");
  chips([{label:"家の中を捜索する", action:"search_house"}]);
};
</script>
</body>
</html>
