<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>GPS Lab</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#294466;--text:#eef5ff;--muted:#91a5bf;--good:#59d49a;--bad:#ff6678}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
main{max-width:650px;margin:auto;padding:28px 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#2876cc;color:white;font-weight:700;font-size:15px}
button.secondary{background:#162840;border:1px solid #365b89}
.value{font-family:ui-monospace,monospace;font-size:14px;word-break:break-all}
.big{font-size:34px;font-weight:800}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#07111f;color:white}
</style>
</head>
<body><main>
<h1>GPS / Geofence Lab</h1>
<p class="muted">怪盗を「指定地点に着いたら解除」にするための実験です。</p>

<div class="panel">
  <h2>1. 現在地を取得</h2>
  <button id="getBtn">現在地を取得する</button>
  <div id="status" class="muted">未取得</div>
  <p class="value" id="coords"></p>
</div>

<div class="panel">
  <h2>2. 今いる場所を目的地にする</h2>
  <p class="muted">テスト用なので、緯度経度をコードに書きません。この端末のブラウザ内だけに保存します。</p>
  <button id="saveTargetBtn" class="secondary" disabled>現在地を目的地として保存</button>
  <p class="value" id="targetText">目的地：未設定</p>
</div>

<div class="panel">
  <h2>3. 到着判定</h2>
  <label>クリア半径（m）</label>
  <input type="number" id="radius" value="50" min="1" max="5000">
  <button id="checkBtn" disabled>目的地までの距離を確認</button>
  <div id="distance" class="big">---</div>
  <div id="result"></div>
</div>

<p><a href="../" style="color:#61a9ff">← Tech Labへ戻る</a></p>

<script>
let current = null;
const $ = id => document.getElementById(id);

function haversine(a,b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const x=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

$("getBtn").onclick=()=>{
  $("status").textContent="位置情報を取得中…";
  if(!navigator.geolocation){
    $("status").textContent="このブラウザは位置情報APIに対応していません。"; return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    current={lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy};
    $("status").textContent=`取得成功（推定誤差 ±${Math.round(current.acc)}m）`;
    $("coords").textContent=`lat: ${current.lat}\nlon: ${current.lon}`;
    $("saveTargetBtn").disabled=false;
    $("checkBtn").disabled=!localStorage.getItem("phantomTarget");
  },err=>{
    $("status").textContent=`取得失敗: ${err.message}`;
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

$("saveTargetBtn").onclick=()=>{
  if(!current) return;
  localStorage.setItem("phantomTarget",JSON.stringify({lat:current.lat,lon:current.lon}));
  renderTarget();
  $("checkBtn").disabled=false;
};

function renderTarget(){
  const t=localStorage.getItem("phantomTarget");
  if(!t){$("targetText").textContent="目的地：未設定";return}
  const p=JSON.parse(t);
  $("targetText").textContent=`目的地保存済み（このブラウザ内）\nlat: ${p.lat}\nlon: ${p.lon}`;
}
renderTarget();
$("checkBtn").disabled=!localStorage.getItem("phantomTarget");

$("checkBtn").onclick=()=>{
  $("result").textContent="現在地を再取得しています…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const here={lat:pos.coords.latitude,lon:pos.coords.longitude};
    const t=JSON.parse(localStorage.getItem("phantomTarget"));
    const d=haversine(here,t);
    const r=Number($("radius").value)||50;
    $("distance").textContent=`${Math.round(d)} m`;
    if(d<=r){
      $("result").innerHTML='<span class="good"><b>LOCATION CONFIRMED</b><br>目的地に到着しました。ゲームならここで次の章を解除できます。</span>';
      if(navigator.vibrate) navigator.vibrate([100,60,180]);
    }else{
      $("result").innerHTML=`<span class="bad"><b>ACCESS DENIED</b><br>あと約 ${Math.max(0,Math.round(d-r))}m 近づいてください。</span>`;
    }
  },err=>{
    $("result").textContent=`取得失敗: ${err.message}`;
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
</script>
</main></body>
</html>
