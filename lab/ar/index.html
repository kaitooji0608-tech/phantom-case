<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Lab</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#guide{
 position:fixed;z-index:10;top:12px;left:12px;right:12px;
 background:rgba(5,12,22,.82);color:white;padding:12px 14px;border-radius:12px;
 font-family:system-ui,-apple-system,sans-serif;border:1px solid rgba(255,255,255,.18)
}
#guide small{color:#b9c9dd}
</style>
</head>
<body>
<div id="guide">
  <b>IMAGE TRACKING AR TEST</b><br>
  <small>カメラを許可して、別画面に表示したテストカードへ向けてください。認識すると「PHANTOM DETECTED」がカード上に固定されます。</small>
</div>

<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="card"
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane color="#111827" opacity="0.9" position="0 0 0.05" width="1.05" height="0.58"></a-plane>
    <a-text value="PHANTOM\nDETECTED"
      color="#ffcf70"
      align="center"
      width="2.2"
      position="0 0 0.08"
      animation="property: scale; from: 0.92 0.92 0.92; to: 1.08 1.08 1.08; dur: 700; loop: true; dir: alternate">
    </a-text>
    <a-ring color="#ffcf70" radius-inner="0.43" radius-outer="0.46"
      position="0 0 0.07"
      animation="property: rotation; to: 0 0 360; dur: 3500; loop: true; easing: linear">
    </a-ring>
  </a-entity>
</a-scene>
</body>
</html>
