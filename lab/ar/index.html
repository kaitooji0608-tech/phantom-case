<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Debug Lab v2</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  /* 重要: カメラ映像を隠さない */
  background:transparent !important;
}

a-scene{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
}

/* MindARが生成するカメラvideoを確実に見せる */
body > video,
video{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  object-fit:cover !important;
}

/* A-Frameのcanvas背景を透明に */
.a-canvas{
  background:transparent !important;
}

#status{
  position:fixed;
  z-index:9999;
  left:12px;
  right:12px;
  top:12px;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(3,10,18,.78);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  font-family:system-ui,-apple-system,sans-serif;
  pointer-events:none;
}
#status b{display:block;margin-bottom:4px}
#state{color:#ffd166}

#help{
  position:fixed;
  z-index:9999;
  left:12px;
  right:12px;
  bottom:12px;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(3,10,18,.72);
  color:#c9d6e5;
  font-size:13px;
  font-family:system-ui,-apple-system,sans-serif;
  pointer-events:none;
}
</style>
</head>

<body>
<div id="status">
  <b>AR DEBUG v2</b>
  状態: <span id="state">ページ読み込み中...</span>
</div>

<div id="help">
  カメラ映像が見えたら、PCで <b>/lab/ar-target/</b> を開いてカード全体へ向けてください。
</div>

<a-scene
  id="scene"
  mindar-image="
    imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
    warmupTolerance: 1;
    missTolerance: 5;
  "
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-plane
      position="0 0 0.05"
      width="1"
      height="0.552"
      color="#7d1010"
      opacity="0.84">
    </a-plane>

    <a-text
      value="PHANTOM\nDETECTED"
      position="0 0 0.10"
      align="center"
      color="#ffffff"
      width="2.2">
    </a-text>

    <a-box
      position="0 0.38 0.12"
      width="0.16"
      height="0.16"
      depth="0.16"
      color="#ffd166"
      animation="property: rotation; to: 0 360 360; loop: true; dur: 1800; easing: linear">
    </a-box>
  </a-entity>
</a-scene>

<script>
const state = document.getElementById("state");
const scene = document.getElementById("scene");
const target = document.getElementById("target");

scene.addEventListener("arReady", () => {
  state.textContent = "カメラ起動OK / ターゲットを探しています";
  state.style.color = "#67e8a5";
});

scene.addEventListener("arError", () => {
  state.textContent = "AR起動エラー";
  state.style.color = "#ff6b7a";
});

target.addEventListener("targetFound", () => {
  state.textContent = "TARGET FOUND ✓";
  state.style.color = "#67e8a5";
  if (navigator.vibrate) navigator.vibrate([100,50,180]);
});

target.addEventListener("targetLost", () => {
  state.textContent = "ターゲットを見失いました";
  state.style.color = "#ffd166";
});
</script>
</body>
</html>
